{% extends 'bookclub/base_bookclub.html' %}

{% block title %}Book Form{% endblock %}

{% block content %}
    {% if object %}
        <h3>Edit Book</h3>
    {% else %}
        <h3>Create Book</h3>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        {% if object %}
            <button type="submit">Save Changes</button>
        {% else %}
            <button type="submit">Add Book</button>
        {% endif %}
    </form>
    <br>
    <br>
    <br>

    <a href="{% url 'bookclub:book_list' %}">Return to book list</a>
{% endblock %}
