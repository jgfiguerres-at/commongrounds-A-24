{% extends "base.html" %}

{% block title %}Common Grounds | New Password{% endblock %}

{% block header %}<h2>Create New Password</h2>{% endblock %}

{% block content %}
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Change password">
        </form>
    {% else %}
        <p>
            Invalid password reset link!
        </p>
    {% endif %} 
{% endblock %}
